name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[test]'
      - run: pytest
      - run: python -m compileall -q broute_bridge scripts
      - run: bash -n install.sh scripts/install-mirza-compat.sh scripts/setup-wizard.sh
      - name: Verify current upstream contracts
        run: python scripts/upstream_watch.py
