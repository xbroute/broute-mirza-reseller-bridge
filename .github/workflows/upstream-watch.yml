name: Upstream compatibility

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: contracts
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/upstream_watch.py 2>&1 | tee upstream-watch.log
      - name: Open or update compatibility alert
        if: steps.contracts.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Upstream compatibility alert';
            const log = fs.readFileSync('upstream-watch.log', 'utf8').slice(-12000);
            const body = `Automated contract checks detected an upstream change. Production auto-update should be treated as unsafe until this is reviewed.\n\nRun: ${context.runId}\n\n\`\`\`text\n${log}\n\`\`\``;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
      - name: Close resolved compatibility alert
        if: steps.contracts.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream compatibility alert';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            for (const issue of issues.filter(i => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: 'Current upstream contract checks are green again; closing this automated alert.'});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'});
            }
      - name: Fail workflow when incompatible
        if: steps.contracts.outcome == 'failure'
        run: exit 1
